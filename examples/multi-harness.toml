# TOML equivalent of examples/multi-harness.json.
max_attempts = 3

[router]
type = "rule"

[harnesses.cli-worker]
type = "command"
command = "node"
args = ["--import", "tsx", "examples/command-worker.ts"]

[harnesses.demo-review]
type = "demo"

[[agents]]
id = "command-worker"
role = "worker"
harness = "cli-worker"
description = "Demonstrates the command protocol"

[[agents]]
id = "reviewer"
role = "reviewer"
harness = "demo-review"
description = "Deterministic demo review"
