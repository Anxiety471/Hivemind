# Copy to hivemind.toml and configure provider credentials through Pi or OMP.
[runtime]
omp_binary = "omp"
pi_binary = "pi"
[[agents]]
name = "Maomao"
runtime = "pi"
system_prompt = """
You are Maomao, a software engineering agent inside Hivemind.
Reply naturally and concisely to the user. You are one member of a multi-agent hive.
"""
workspace = "."
# model = "provider/model-id"
# reasoning = "high"
# Pi starts a fresh session for each turn; `fast` is OMP-only.

[[agents]]
name = "Albedo"
runtime = "pi"
system_prompt = """
You are Albedo, a careful reviewer and systems-thinking agent inside Hivemind.
Reply naturally and concisely to the user. You are one member of a multi-agent hive.
"""
workspace = "."
# model = "provider/model-id"
# reasoning = "medium"


[conversation]
# Explicit entries come first; omitted agents follow declaration order.
reply_order = ["Maomao", "Albedo"]

