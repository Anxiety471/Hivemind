# Copy to hivemind.toml and configure each selected runtime separately.
[runtime]
omp_binary = "omp"
pi_binary = "pi"
# Maximum seconds a runtime prompt may stay silent (no streamed text, tool, or status event) before it times out; 300 by default, 0 disables the timeout. A long-running but active agent is not interrupted.
prompt_timeout_secs = 300
# Seconds an unused agent-instance runtime stays alive before it is stopped; 0 never idles out.
idle_timeout_secs = 120

[conversation]
reply_order = ["Engineer", "Reviewer"]

[context]
recent_turns = 6
summary_max_tokens = 2000
context_target_tokens = 12000
# Live runtime context size at which that runtime is rotated before its next turn.
runtime_rotate_tokens = 24000
summary_refresh_turns = 4

[memory]
# Deterministic memory core: local SQLite with FTS5 search, no LLM required.
mode = "deterministic"

[[personas]]
id = "Engineer"
role = "Software Engineer"
runtime = "pi"
system_prompt = "You are the Engineer, a software engineering agent. Reply naturally and concisely."
workspace = "."
# model = "provider/model-id"
# reasoning = "high"

[[personas]]
id = "Reviewer"
role = "Reviewer"
runtime = "pi"
system_prompt = "You are the Reviewer, a careful reviewer and systems thinker."
workspace = "."

[[groups]]
id = "development"
mode = "discussion"
members = ["Engineer", "Reviewer"]
reply_order = ["Reviewer", "Engineer"]
# workspace = "/abs/path/to/project"  # optional shared workspace; agents can also set it via chat
[groups.member_roles]
Engineer = "Backend Engineer"
Reviewer = "Architecture Reviewer"

[[groups]]
id = "review"
mode = "broadcast"
members = ["Reviewer", "Engineer"]
[groups.member_roles]
Reviewer = "Lead Reviewer"
Engineer = "Implementation Reviewer"

# Optional, top level: restrict where agents may point a workspace with workspace.set.
# [workspaces]
# roots = ["/abs/path/to/projects"]

# Optional: skills Hivemind offers agents (skills.list / skills.read). Runtimes' own skills never load.
# [skills]
# dirs = ["~/.agents/skills"]

# Issue council: agents discuss the next feature, improvement, or bug fix and
# file it. Issues are not implemented. Off until enabled. `automatic` waits
# until the hive has been quiet; `scheduled` runs on the interval either way.
# [issues]
# enabled = false
# mode = "automatic"          # or "scheduled"
# interval_secs = 86400       # minimum gap between councils; the schedule in scheduled mode
# idle_secs = 1800            # automatic mode: how long chat and tasks must stay quiet
# max_issues_per_round = 5
# members = ["Engineer", "Reviewer"]
# group = "development"       # optional; overrides members
# workspace = "."             # optional path the council is asked to consider
# prompt = "Decide the next bug the hive should file."  # omit to use the built-in goal

# Durable execution defaults: limits are disabled until configured.
# [execution]
# task_token_limit = 100000
# project_token_limit = 1000000
# require_usage = false
#
# [[execution.checks]]
# name = "cargo-test"
# command = ["cargo", "test", "--locked"]
# timeout_secs = 300
#
# Remote access is opt-in and requires an environment-backed operator token.
# [server]
# bind = "0.0.0.0"
# token_env = "HIVEMIND_OPERATOR_TOKEN"
# allowed_origins = ["https://hivemind.example.com"]
