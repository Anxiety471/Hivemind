# Copy to hivemind.toml and configure each selected runtime separately.
[runtime]
omp_binary = "omp"
pi_binary = "pi"
# Maximum seconds a runtime prompt may take; 300 by default, 0 disables the timeout.
prompt_timeout_secs = 300
# Seconds an unused agent-instance runtime stays alive before it is stopped; 0 never idles out.
idle_timeout_secs = 120

[conversation]
reply_order = ["Engineer", "Reviewer"]

[context]
recent_turns = 6
summary_max_tokens = 2000
context_target_tokens = 12000
# Live runtime context size at which that runtime is rotated before its next turn.
runtime_rotate_tokens = 24000
summary_refresh_turns = 4

[memory]
# Deterministic memory core: local SQLite with FTS5 search, no LLM required.
mode = "deterministic"

[[personas]]
id = "Engineer"
role = "Software Engineer"
runtime = "pi"
system_prompt = "You are the Engineer, a software engineering agent. Reply naturally and concisely."
workspace = "."
# model = "provider/model-id"
# reasoning = "high"

[[personas]]
id = "Reviewer"
role = "Reviewer"
runtime = "pi"
system_prompt = "You are the Reviewer, a careful reviewer and systems thinker."
workspace = "."

[[groups]]
id = "development"
mode = "discussion"
members = ["Engineer", "Reviewer"]
reply_order = ["Reviewer", "Engineer"]
[groups.member_roles]
Engineer = "Backend Engineer"
Reviewer = "Architecture Reviewer"

[[groups]]
id = "review"
mode = "broadcast"
members = ["Reviewer", "Engineer"]
[groups.member_roles]
Reviewer = "Lead Reviewer"
Engineer = "Implementation Reviewer"
