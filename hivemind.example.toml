# Copy to hivemind.toml and configure each selected runtime separately.
[runtime]
omp_binary = "omp"
pi_binary = "pi"
# Seconds an unused agent-instance runtime stays alive before it is stopped; 0 never idles out.
idle_timeout_secs = 120

[conversation]
reply_order = ["Maomao", "Albedo"]

[context]
recent_turns = 6
summary_max_tokens = 2000
context_target_tokens = 12000
# Live runtime context size at which that runtime is rotated before its next turn.
runtime_rotate_tokens = 24000
summary_refresh_turns = 4

[memory]
# Deterministic memory core: local SQLite with FTS5 search, no LLM required.
mode = "deterministic"

[tasks]
# Chat agents are read-only; they hand edits to a task thread. Threads that may run at once.
max_concurrent = 4
# Attempts per piece of work: the first handoff plus persona-initiated retries.
max_attempts = 3

[[personas]]
id = "Maomao"
role = "Software Engineer"
runtime = "pi"
system_prompt = "You are Maomao, a software engineering agent. Reply naturally and concisely."
workspace = "."
# model = "provider/model-id"
# reasoning = "high"

[[personas]]
id = "Albedo"
role = "Reviewer"
runtime = "pi"
system_prompt = "You are Albedo, a careful reviewer and systems thinker."
workspace = "."

[[groups]]
id = "development"
mode = "discussion"
members = ["Maomao", "Albedo"]
reply_order = ["Albedo", "Maomao"]
[groups.member_roles]
Maomao = "Backend Engineer"
Albedo = "Architecture Reviewer"

[[groups]]
id = "review"
mode = "broadcast"
members = ["Albedo", "Maomao"]
[groups.member_roles]
Albedo = "Lead Reviewer"
Maomao = "Implementation Reviewer"
