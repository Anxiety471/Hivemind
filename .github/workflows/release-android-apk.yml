name: release-android-apk

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # APK and AAB builds increment the same remote Android version counter.
  group: release-android
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and deliver the Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require Expo automation token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret with access to the inbox-zero/rakazo Expo project." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        run: pnpm --filter @rakazo/mobile check

      # Without Firebase config the APK never registers for push, and an OTA update can't add it.
      - name: Require Firebase config
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          vars="$(pnpm exec eas env:list production --format short)"
          if ! grep -q '^GOOGLE_SERVICES_JSON=' <<< "$vars"; then
            echo "Set the GOOGLE_SERVICES_JSON file variable in the EAS production environment (see docs/mobile-release.md)." >&2
            exit 1
          fi

      # EAS signs with the project's managed Android keystore and bakes in the production update
      # channel, so installed APKs receive the same OTA updates as store builds.
      - name: Build APK on EAS
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec eas build --platform android --profile android-apk --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
          version="$(jq -r '.[0].appVersion' "$RUNNER_TEMP/build.json")"
          version_code="$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/build.json")"
          if [[ -z "$url" || "$url" == "null" || "$url" != https://* ]]; then
            echo "EAS did not return an APK download URL." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/rakazo.apk" "$url"
          if [[ "$(head -c 2 "$RUNNER_TEMP/rakazo.apk")" != "PK" ]]; then
            echo "The downloaded artifact is not an APK." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      # Deliver the APK to the deployment itself. The server stores it behind a session, so the
      # only download is GET /api/account/mobile-app/android for a signed-in account; no public
      # release asset exists. The receiver sees the file on stdin and the digest in
      # SSH_ORIGINAL_COMMAND.
      - name: Deliver the APK to the deployment
        env:
          SSH_HOST: ${{ secrets.MOBILE_APK_SSH_HOST }}
          SSH_PORT: ${{ secrets.MOBILE_APK_SSH_PORT }}
          SSH_USER: ${{ secrets.MOBILE_APK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.MOBILE_APK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MOBILE_APK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_HOST" ]]; then
            echo "::notice title=APK delivery skipped::Set the MOBILE_APK_SSH_* repository secrets to deliver the APK to a deployment."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/mobile-apk"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mobile-apk" "$HOME/.ssh/known_hosts"
          digest="$(sha256sum "$RUNNER_TEMP/rakazo.apk" | cut -d' ' -f1)"
          ssh -F /dev/null -i "$HOME/.ssh/mobile-apk" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sha256 $digest" < "$RUNNER_TEMP/rakazo.apk"
