name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$package_version" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          asset="hivemind-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "$asset" hivemind
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hivemind-x86_64-unknown-linux-gnu.tar.gz
            hivemind-x86_64-unknown-linux-gnu.tar.gz.sha256
