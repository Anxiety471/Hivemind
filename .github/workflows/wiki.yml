name: Wiki

# Publishes wiki/ to the GitHub wiki. The wiki must already exist:
# create any first page once in the GitHub UI before this can push.
on:
  push:
    branches: ["main"]
    paths: ["wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
